// SubStudio Browser AutoConfig 0.1.1
// SPDX-License-Identifier: MPL-2.0
// First line must be a comment. This file lives only in the copied runtime
// (%LOCALAPPDATA%\SubStudioBrowser\runtime), never in Program Files.

defaultPref("network.proxy.socks_remote_dns", true);
defaultPref("network.proxy.socks5_remote_dns", true);

// HTTP/3 / QUIC is UDP. Firefox SOCKS has no UDP ASSOCIATE (Bug 1808692).
defaultPref("network.http.http3.enable", false);

defaultPref("privacy.userContext.enabled", true);
defaultPref("privacy.userContext.ui.enabled", true);

// Companion WebExtension owns the left tab strip (Sidebery-style).
// Do not use stock vertical tabs as the product UI.
defaultPref("sidebar.revamp", true);
defaultPref("sidebar.verticalTabs", false);
defaultPref("sidebar.visibility", "always-show");
defaultPref("sidebar.position_start", true);

// Stock Mozilla AI panel loads grok.com as a website and appends ?q=.
// The API agent is the companion sidecar — do not point this at :1234.
defaultPref("browser.ml.chat.enabled", true);
defaultPref("browser.ml.chat.hideLocalhost", false);
defaultPref("browser.ml.chat.provider", "https://grok.com");

// Unsigned companion XPI: honored on ESR / Developer Edition / Nightly only.
defaultPref("xpinstall.signatures.required", false);

defaultPref("browser.startup.homepage", "about:home");
defaultPref("browser.startup.page", 1);
defaultPref("browser.shell.checkDefaultBrowser", false);

// Private-profile userChrome / userContent (cream/ink). Not a Gecko fork.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// Load the Grok right-dock. Prefs above already applied if this throws.
try {
  if (typeof ChromeUtils !== "undefined") {
    const Services = ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
    const file = Services.dirsvc.get("CurProcD", Components.interfaces.nsIFile);
    file.append("substudio-chrome.js");
    if (file.exists()) {
      Services.scriptloader.loadSubScript(Services.io.newFileURI(file).spec);
    }
  }
} catch (exc) {
  /* sandbox on, or chrome file missing — Space bar still works on ESR */
}
