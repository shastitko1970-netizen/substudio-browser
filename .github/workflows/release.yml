name: Release

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_overlay.py
      - name: Build
        run: python scripts/build_release.py
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "SubStudio Browser ${TAG#v}" \
            --notes "Overlay + companion + updates.json. Launcher is the primary updater. Extension update_url needs a signed XPI on Firefox Release." \
            dist/SubStudioBrowser-*.zip \
            dist/SubStudioBrowser-*.zip.sha256 \
            dist/substudio-companion-*.xpi \
            dist/updates.json
