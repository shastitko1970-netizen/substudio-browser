name: Release

on:
  push:
    tags:
      - "v0.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: python tests/test_overlay.py
      - name: Build overlay
        run: python scripts/build_release.py
      - name: Build Setup.exe
        run: python scripts/build_setup.py
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(cat <<'EOF'
          ## Windows

          Download **SubStudioBrowser-Setup-*.exe** (not the zip). Unsigned: SmartScreen → More info → Run anyway.

          - Frameless Setup.exe — one caption, our min/close only
          - Progress log in %TEMP% (no lock on setup-progress.jsonl in AppData)
          - Sidecar: Grok (official xAI) **or** Hermes (connects to a running agent on :8642 / :8645)

          Fetch Firefox ESR at install time. Daily Firefox in Program Files is never patched.

          Zip is the in-app updater payload. Extension update_url needs a signed XPI on Firefox Release.
          EOF
          )"
          ASSETS=(
            dist/SubStudioBrowser-*.zip
            dist/SubStudioBrowser-*.zip.sha256
            dist/SubStudioBrowser-Setup-*.exe
            dist/SubStudioBrowser-Setup-*.exe.sha256
            dist/substudio-companion-*.xpi
            dist/updates.json
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "SubStudio Browser ${TAG#v}" \
              --notes "$NOTES" \
              "${ASSETS[@]}"
          fi
